<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predict - Sri Lanka Drought Watch</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-icon">🌦️</span>
        <span>Sri Lanka Drought Watch</span>
      </a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="predict.html">Predict Drought</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="page-title">Drought Prediction</h1>
    <p class="page-subtitle">
      Select a meteorological station and a target month to get a drought forecast.
    </p>

    <section class="predict-panel">
      <form id="predict-form">
        <div class="form-grid">
          <div class="form-field full">
            <label for="station-select"><span>📍</span><span>Meteorological Station</span></label>
            <select id="station-select" required></select>
          </div>

          <div class="form-field">
            <label for="month-select"><span>🗓️</span><span>Target Month</span></label>
            <select id="month-select" required></select>
          </div>

          <div class="form-field">
            <label for="year-select"><span>📆</span><span>Target Year</span></label>
            <select id="year-select" required></select>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn" id="predict-btn">
            <span class="spinner"></span>
            <span>🔍</span>
            <span>Get Prediction</span>
          </button>
        </div>
      </form>

      <p id="status-msg" class="status-msg hidden"></p>
    </section>

    <section id="result-section" class="result-card hidden">
      <h2>Prediction Result</h2>

      <div class="result-header">
        <div>
          <div class="station-name"><span>📍</span><span id="result-station">-</span></div>
          <div class="target-month" id="result-month">-</div>
        </div>
        <div id="result-risk-badge" class="risk-badge">-</div>
      </div>

      <div class="metric-row">
        <div class="metric-label">
          <span>Drought Probability</span>
          <span class="metric-value" id="result-probability">-</span>
        </div>
        <div class="probability-bar">
          <div class="probability-bar-fill" id="result-probability-bar" style="width: 0%"></div>
        </div>
      </div>

      <div class="metric-row">
        <div class="metric-label">
          <span>Predicted SPI-3 Mean</span>
        </div>
        <div class="spi-value" id="result-spi">-</div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>Sri Lanka Drought Prediction System</span>
  </footer>

  <script src="script.js"></script>
  <script src="predict.js"></script>
</body>
</html>
